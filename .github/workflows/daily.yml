name: Daily NLRB Scrape

on:
  schedule:
    - cron: '0 12 * * *'  # runs every day at 12:00 UTC (8am Eastern)
  workflow_dispatch:        # also lets you run it manually

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

- name: Run backfill if no data yet
        run: |
          if [ ! -f data.json ] || [ $(python -c "import json; d=json.load(open('data.json')); print(len(d.get('cases',{})))") -eq 0 ]; then
            echo "No data or empty, running backfill..."
            python scrape.py --backfill
          else
            echo "data.json exists with data, running daily update..."
            python scrape.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Daily NLRB update $(date -u '+%Y-%m-%d')"
          git push
