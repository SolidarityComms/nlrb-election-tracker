name: Daily NLRB Scrape

on:
  schedule:
    - cron: '0 12 * * *'   # 8am Eastern
    - cron: '0 17 * * *'   # 12pm Eastern
    - cron: '0 22 * * *'   # 5pm Eastern
    - cron: '0 2 * * *'    # 9pm Eastern
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf

      - name: Run scraper
        run: |
          if python -c "import json; d=json.load(open('data.json')); exit(0 if len(d.get('cases',{})) > 0 else 1)" 2>/dev/null; then
            echo "data.json has cases, running daily update..."
            python scrape.py
          else
            echo "No cases found, running backfill..."
            python scrape.py --backfill
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Daily NLRB update $(date -u '+%Y-%m-%d %H:%M')"
          git push
